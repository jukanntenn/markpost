# prek configuration — workspace root. See:
#   - backend/prek.toml   (Go hooks, cwd=backend)
#   - frontend/prek.toml  (JS/TS hooks, cwd=frontend)
#
# Single source of truth for the whole pipeline: AI post-edit hooks run
# `prek run --group fmt --files <edited>`, AI Stop runs `prek run --group lint
# --all-files`, CI runs `prek run --all-files`. No parallel formatter/lint
# definition exists outside prek.
#
# Install: prek install

default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# Mutating/fixer builtins share one generated-file exemption (the generator
# owns those bytes; a fixer diverging from raw output would trip the
# generate-check gate in backend/prek.toml). The regex is inlined per hook
# because prek does not support config-level variable interpolation.

# ---- Read-only builtin checks (commit + CI; cover the whole tree) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

# ---- fmt group: mutating fixers (AI post-edit + commit) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|backend/internal/web/(csshash\\.go|post\\.[0-9a-f]+\\.css)$", groups = [
    "fmt",
  ] },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ], exclude = "backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|backend/internal/web/(csshash\\.go|post\\.[0-9a-f]+\\.css)$", groups = [
    "fmt",
  ] },
  { id = "end-of-file-fixer", exclude = "backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|backend/internal/web/(csshash\\.go|post\\.[0-9a-f]+\\.css)$", groups = [
    "fmt",
  ] },
]

# ---- GitHub Actions: actionlint (auto-installed via go install) ----
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "local"

# AI tool configs in sync (AGENTS.md == CLAUDE.md, skills mirrored).
[[repos.hooks]]
id = "agents-sync"
name = "AI tool configs in sync"
language = "system"
entry = "scripts/check_agents.py"
files = "^(AGENTS|CLAUDE)\\.md$|^\\.claude/skills/|^\\.agents/skills/"
pass_filenames = false
stages = ["pre-commit"]

# ---- fmt group: root-level formatters (non-frontend, non-agent-dir) ----
[[repos.hooks]]
id = "prettier-root"
name = "prettier (root, non-frontend)"
language = "system"
entry = "prettier --write"
files = "\\.(md|ya?ml|html|json|css)$"
exclude = "^(\\.agents|\\.claude|\\.codex|\\.opencode|\\.zcode)/|^frontend/|^backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|^backend/internal/web/post\\.[0-9a-f]+\\.css$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# oxfmt for toml (skipped gracefully if not installed).
[[repos.hooks]]
id = "oxfmt"
name = "oxfmt (toml)"
language = "system"
entry = "command -v oxfmt >/dev/null || { echo 'oxfmt not installed, skipping'; exit 0; }; oxfmt --write \"$@\""
shell = "bash"
files = "\\.toml$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# caddy fmt for Caddyfile (skipped gracefully if not installed; .j2 templates
# are intentionally NOT formatted — djlint collapses Ansible {% %} block tags
# and breaks trim_blocks rendering. See devops/ansible note in README.)
[[repos.hooks]]
id = "caddy-fmt"
name = "caddy fmt (Caddyfile)"
language = "system"
entry = "command -v caddy >/dev/null || { echo 'caddy not installed, skipping'; exit 0; }; for f in \"$@\"; do caddy fmt --overwrite \"$f\"; done"
shell = "bash"
files = "(^|/)Caddyfile(\\.(dev|staging|local|production))?$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# Ansible Jinja2 templates: validate they render to parseable output (no
# formatting — see caddy-fmt note on why djlint is not used).
[[repos.hooks]]
id = "ansible-templates"
name = "ansible templates render+parse (j2)"
language = "system"
entry = "scripts/check-ansible-templates.py"
files = "^devops/ansible/templates/.*\\.j2$"
pass_filenames = false
stages = ["pre-commit"]

# ---- commit-msg: Conventional Commits ----
[[repos.hooks]]
id = "conventional-commits"
name = "commit message format"
language = "system"
entry = "scripts/check_commit_msg.py"
pass_filenames = true
stages = ["commit-msg"]
