---
# production (ttyo @ 43.133.160.29) — the SaaS origin behind Cloudflare.
# The edge connects to host port 443, terminated by the host's systemd Caddy
# (the shared gateway; TLS = Origin CA cert). markpost joins as a conf.d site
# block proxying to the container, which serves plain HTTP published
# loopback-only. 443 is the only proxied HTTPS port with edge caching enabled —
# every other one is cache-disabled and re-enabling is Enterprise-only.

env: production

# Pinned rather than `latest`: the docker-publish workflow deliberately does not
# move `latest` for prerelease tags, so `latest` would silently resolve to an
# older release. Bump on promotion, after staging has validated the same version.
# Format: the Docker Hub tag — releases after the tag-format switch drop the
# leading "v" (v0.2.1 -> 0.2.1, v0.2.1-rc.1 -> 0.2.1-rc.1); v0.2.0-rc.3 below
# predates the switch.
markpost_version: "0.2.0-rc.5"
image: "jukanntenn/markpost:{{ markpost_version }}"

# Version the binary reports at /api/v1/version (VERSION build-arg = the git
# tag at build time, v-prefixed). The deploy fails if it does not match.
# For releases built after the tag-format switch this is "v" + markpost_version.
expected_version: "v0.2.0-rc.5"

public_url: "https://markpost.cc"
trusted_proxies: '["127.0.0.1", "::1"]'

host_port: 8080
tls_profile: http
caddyfile_template: Caddyfile.production.j2
debug: false

# Host Caddy gateway (shared across services on the VPS; config imports
# /etc/caddy/conf.d/*.caddy). The playbook copies the Origin CA cert from
# {{ app_path }}/certs/ and templates one site block; reload fires on change
# only. Other services join the same gateway with their own site blocks.
gateway_host: markpost.cc
gateway_site_file: /etc/caddy/conf.d/markpost.caddy
gateway_certs_dir: /etc/caddy/certs/markpost

# Cloudflare CIDR ranges for the host firewall allowlist on 443. No template
# consumes this list anymore — client-IP trust moved to the loopback hop
# between gateway and container. Sync from https://www.cloudflare.com/ips/
# (IPv4 + IPv6, space-separated).
cloudflare_cidrs: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32"
cloudflare_zone_id: 63edf965a56621e7982cce517cf2e219

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"
  - "{{ app_path }}/certs"

# Beszel metrics agent (the hub is ops-managed on a separate server; this repo
# automates only the agent — see docs/monitoring.md for the split). The deploy
# installs the agent only when beszel_hub_url is defined, mirroring the
# heartbeat's setup-order contract: add beszel_hub_url (the hub's /beszel/agent
# WebSocket URL) and beszel_agent_key (the hub's PUBLIC key, not a secret —
# shown when adding a system in the hub) once the hub exists; removing the
# vars does not uninstall. Pin deliberately: bump only after reviewing the
# release notes.
beszel_agent_version: "0.18.8"
beszel_agent_image: "henrygd/beszel-agent:{{ beszel_agent_version }}"
