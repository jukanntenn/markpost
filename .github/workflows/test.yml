name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      mcp: ${{ steps.f.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'
            # The mcp e2e suite builds ../backend from source, so backend
            # changes exercise it too.
            mcp:
              - 'mcp/**'
              - 'backend/**'
              - '.github/workflows/test.yml'

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      # Backend tests use testcontainers-go (postgres); needs docker socket.
      # -race: catch data races in concurrent code (singleflight, rate limiter,
      #   cache). -covermode=atomic is required when combining -race with -cover.
      - name: Test
        working-directory: backend
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Vitest
        working-directory: frontend
        run: pnpm test:run --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  test-mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: mcp/go.sum
      # -race mirrors test-backend. The e2e tag suite starts a postgres
      # testcontainer and drives a real backend built from ../backend, so it
      # needs the docker socket (present on hosted runners).
      - name: Test
        working-directory: mcp
        run: go test -race ./... && go test -race --tags e2e ./e2e

  # Stable per-workflow verdict for branch protection's required checks
  # (.agents/mrfcs/implemented/2026-08-24-pr-conclusion-jobs-required-checks.md):
  # runs past skips and failures, skipped jobs count as success.
  conclusion:
    # Distinct check name so branch protection's required-check picker is
    # unambiguous (five bare "conclusion" names are not selectable apart).
    name: Test conclusion
    needs: [changes, test-backend, test-frontend, test-mcp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::A job failed or was cancelled: $results"
            exit 1
          fi
