---
# markpost unified deployment playbook.
#
# A single playbook serves dev / staging / production. The target environment
# is selected with -e target=<env> (default: dev), and per-environment
# differences live in group_vars/<env>/ (vars.yml + vault.yml, auto-loaded).
# Run from the repo root — ansible.cfg there supplies the inventory and the
# avpm vault identities:
#
#   ansible-playbook devops/ansible/deploy.yml                  # dev (fn)
#   ansible-playbook devops/ansible/deploy.yml -e target=staging
#   ansible-playbook devops/ansible/deploy.yml -e target=production
#
# Pass --ask-become-pass unless the users involved are passwordless-sudo: the
# gateway/heartbeat/backup tasks become root on the env host, and the Grafana
# tenant copies at the end of the play become root on hs1 (delegated; see the
# tenant-sync block there).

- name: Validate target environment
  # Runs before the deploy play so a misspelled target fails loudly — a bare
  # hosts pattern that matches nothing would otherwise exit 0 without
  # deploying anywhere.
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tgt: "{{ target | default('dev') }}"
  tasks:
    - name: Require target to be a non-empty known environment
      ansible.builtin.assert:
        that: tgt in ['dev', 'staging', 'production'] and groups.get(tgt, []) | length > 0
        fail_msg: >-
          Unknown or empty target '{{ tgt }}'. Use dev (the default),
          staging or production.

- name: Deploy markpost
  hosts: "{{ target | default('dev') }}"
  user: "{{ user }}"
  gather_facts: false

  vars:
    # Grafana tenant sync (the delegated task block at the end of this play):
    # a delegated task's variables resolve against the play's env host, not
    # against the delegated hs1, so hs1's host_vars are bridged through
    # hostvars[] here. The vaulted grafana_api_token deliberately has no
    # bridge — a bridged name would always look defined, breaking the
    # token-gated setup order; the block loads it conditionally instead.
    grafana_provisioning_path: "{{ hostvars['hs1'].grafana_provisioning_path }}"
    grafana_port: "{{ hostvars['hs1'].grafana_port }}"
    grafana_api_base: "http://127.0.0.1:{{ grafana_port }}"
    grafana_dashboard_uids:
      - markpost-overview
      - markpost-http
      - markpost-runtime
      - markpost-delivery
    # 11 evaluating rules + the paused ERROR-log-rate rule (see the RFC's
    # reconciliation against the docs/monitoring.md inventory table).
    grafana_rule_count: 12

  tasks:
    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ app_dirs }}"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Template config.toml
      ansible.builtin.template:
        src: config.toml.j2
        dest: "{{ config_file }}"
        mode: "0600"

    - name: Template Caddyfile
      ansible.builtin.template:
        src: "{{ caddyfile_template }}"
        dest: "{{ caddyfile }}"
        mode: "0644"

    # Host Caddy gateway (production only): the shared systemd Caddy on the
    # VPS terminates TLS on 443 and proxies to the container's loopback port.
    # These tasks run BEFORE the container is recreated so that, on the
    # 2053→443 switch day (Origin Rule deleted in the dashboard first), the
    # gateway is already serving when the container flips ports. The reload
    # handler fires only when the cert copy or the site block changes.
    - name: Ensure gateway certificate directory exists
      ansible.builtin.file:
        path: "{{ gateway_certs_dir }}"
        state: directory
        owner: root
        group: caddy
        mode: "0750"
      become: true
      when: env == 'production'

    - name: Copy Origin CA certificate to the host Caddy gateway
      ansible.builtin.copy:
        remote_src: true
        src: "{{ app_path }}/certs/{{ item.name }}"
        dest: "{{ gateway_certs_dir }}/{{ item.name }}"
        owner: root
        group: caddy
        mode: "{{ item.mode }}"
      loop:
        - { name: origin.pem, mode: "0644" }
        - { name: origin.key, mode: "0640" }
      become: true
      when: env == 'production'
      notify: Reload host Caddy gateway

    - name: Template markpost site block into the host Caddy gateway
      ansible.builtin.template:
        src: markpost.caddy.j2
        dest: "{{ gateway_site_file }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      when: env == 'production'
      notify: Reload host Caddy gateway

    # Handlers otherwise wait for the end of the play — after the edge
    # verification below — so a first deploy would verify against a gateway
    # that has the site block on disk but never reloaded. Flush here so the
    # reload happens before the container and traffic flip.
    - name: Flush gateway handlers before the traffic flip
      ansible.builtin.meta: flush_handlers

    # WAL archival tier (staging + production, MRFC
    # 2026-07-09-wal-archival-disaster-recovery) — staging is the promotion
    # gate and must rehearse the production shape, each environment against
    # its own bucket and vault pair. Guarded on the vaulted B2 key id,
    # mirroring the heartbeat's setup-order contract: create the bucket and
    # the no-delete application key first (docs/backup.md), vault the pair,
    # then deploy. Removing the vault vars does not uninstall.
    - name: Copy postgres archival Dockerfile
      ansible.builtin.copy:
        src: postgres-archival.Dockerfile
        dest: "{{ pgbackrest_dockerfile }}"
        mode: "0644"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    - name: Template pgBackRest configuration
      ansible.builtin.template:
        src: pgbackrest.conf.j2
        dest: "{{ pgbackrest_conf }}"
        mode: "0644"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    # Scheduled backup operations (same guard as the provisioning above): the
    # scripts run against the running compose project, carry no secrets, and
    # take the project dir as $1 — the cron entries own every
    # deployment-specific value. zstd + rclone are host-side stream stages for
    # the daily logical dump. The unprivileged probe keeps deploys off sudo
    # once the tools exist (staging hosts have no passwordless sudo); the
    # privileged install runs only when the probe misses a tool.
    - name: Check for backup stream tools
      ansible.builtin.shell: command -v zstd && command -v rclone
      register: backup_stream_tools
      changed_when: false
      failed_when: false
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    - name: Install backup stream tools
      ansible.builtin.package:
        name:
          - zstd
          - rclone
        state: present
      become: true
      when: >-
        env in ['staging', 'production'] and b2_repo_key_id is defined
        and (backup_stream_tools.rc | default(1)) != 0

    - name: Install backup scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_path }}/{{ item }}"
        mode: "0750"
      loop:
        - pgbackrest-backup.py
        - pgbackrest-check.py
        - pg-dump-backup.py
        - pgbackrest-drill.py
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    # 0600: carries the vaulted B2 key pair (and the optional kuma push URL).
    - name: Template backup environment file
      ansible.builtin.template:
        src: backup.env.j2
        dest: "{{ app_path }}/backup.env"
        mode: "0600"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    # Off-peak on purpose (the 3 Mbps uplink is the binding constraint): dump
    # at 03:30 rate-limited, incremental/full backup after the 04:15 retention
    # prune, observability last so it sees the night's results, drill on the
    # 2nd (day 1 is the full backup itself).
    - name: Schedule daily logical dump
      ansible.builtin.cron:
        name: markpost-pg-dump-backup
        hour: "3"
        minute: "30"
        job: "{{ app_path }}/pg-dump-backup.py {{ app_path }} >> {{ app_path }}/pg-dump-backup.log 2>&1"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    - name: Schedule daily pgBackRest backup
      ansible.builtin.cron:
        name: markpost-pgbackrest-backup
        hour: "4"
        minute: "45"
        job: "{{ app_path }}/pgbackrest-backup.py {{ app_path }} >> {{ app_path }}/pgbackrest-backup.log 2>&1"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    - name: Schedule daily backup observability
      ansible.builtin.cron:
        name: markpost-pgbackrest-check
        hour: "5"
        minute: "30"
        job: "{{ app_path }}/pgbackrest-check.py {{ app_path }} >> {{ app_path }}/pgbackrest-check.log 2>&1"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    - name: Schedule monthly restore drill
      ansible.builtin.cron:
        name: markpost-pgbackrest-drill
        day: "2"
        hour: "5"
        minute: "0"
        job: "{{ app_path }}/pgbackrest-drill.py {{ app_path }} >> {{ app_path }}/pgbackrest-drill.log 2>&1"
      when: env in ['staging', 'production'] and b2_repo_key_id is defined

    # Schema changes are applied by `markpost migrate up`, never implicitly on
    # serve — infra.New only opens the connection. So the deploy has to order
    # postgres → migrate → app itself, rather than bringing everything up at
    # once: a new image whose code expects a new column would otherwise start
    # serving against an un-migrated database.
    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ app_path }}"
        # With the archival tier active the postgres image is compose-built
        # locally and exists in no registry, so the pull scopes down to the
        # one registry-backed service; otherwise pull everything as before.
        services: "{{ ['markpost'] if env in ['staging', 'production'] and b2_repo_key_id is defined else omit }}"

    - name: Start postgres and wait until it is healthy
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        services:
          - postgres
        state: present
        wait: true
        wait_timeout: 120

    # Idempotent: MigrateUp swallows migrate.ErrNoChange, so re-running is a
    # no-op. It reports "changed" every time regardless because the command
    # gives no machine-readable way to tell a no-op from an applied migration.
    - name: Apply database migrations
      community.docker.docker_compose_v2_run:
        project_src: "{{ app_path }}"
        service: markpost
        entrypoint: markpost
        argv:
          - "-c"
          - "/app/config.toml"
          - "migrate"
          - "up"
        no_deps: true
        cleanup: true
        detach: false
        # tty=false emits -T/--no-TTY. interactive is deliberately left at its
        # default: interactive=false would emit --no-interactive, a flag docker
        # compose does not have (checked against v5.1.3), and the run fails with
        # "unknown flag: --no-interactive".
        tty: false

    - name: Start all services and wait until healthy
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        state: present
        remove_orphans: true
        wait: true
        wait_timeout: 120

    # Availability heartbeat (staging + production): a supervisor-managed loop
    # probes the loopback-published /api/v1/ready and pushes the verdict to
    # the uptime-kuma push monitor. Symmetric on purpose — staging must
    # rehearse the exact production shape before promotion (MRFC
    # 2026-10-04-observability-wiring-overhaul). Guarded on
    # kuma_heartbeat_url (a vault secret) so the deploy stays green until the
    # push monitor exists in kuma and the URL is vaulted — see
    # docs/monitoring.md for the setup order. Removing the vault var does not
    # uninstall; the runbook owns that.
    - name: Install heartbeat script
      ansible.builtin.copy:
        src: heartbeat.py
        dest: "{{ app_path }}/heartbeat.py"
        mode: "0750"
      when: env in ['staging', 'production'] and kuma_heartbeat_url is defined

    # 0600: the vaulted push URL rides the environment= line in this conf.
    - name: Template markpost heartbeat supervisor program
      ansible.builtin.template:
        src: markpost-heartbeat.conf.j2
        dest: /etc/supervisor/conf.d/markpost-heartbeat.conf
        owner: root
        group: root
        mode: "0600"
      become: true
      when: env in ['staging', 'production'] and kuma_heartbeat_url is defined
      notify: Update markpost heartbeat supervisor program

    # Daily retention sweep (all environments): cron invokes both prune
    # subcommands in a throwaway container against the running compose project;
    # per-user retention_days and the global config both apply (MRFC
    # 2026-08-31-per-user-history-retention-policy). Output lands in
    # prune-retention.log under app_path so sweeps and failures are observable.
    - name: Install retention prune script
      ansible.builtin.copy:
        src: prune-retention.sh
        dest: "{{ app_path }}/prune-retention.sh"
        mode: "0750"

    - name: Schedule daily retention prune
      ansible.builtin.cron:
        name: markpost-retention-prune
        hour: "4"
        minute: "15"
        job: "{{ app_path }}/prune-retention.sh {{ app_path }} >> {{ app_path }}/prune-retention.log 2>&1"
    # Host metrics agent (production only): the Beszel agent in its own compose
    # project, a sibling of the app. The hub runs on the observability server —
    # the repo automates only this half. Guarded on beszel_hub_url (plain
    # group_vars value) AND beszel_agent_token (vaulted) so the agent never
    # renders without both halves of the WebSocket credential pair, mirroring
    # the heartbeat's setup-order contract; removing the vars does not uninstall.
    - name: Ensure beszel-agent directory exists
      ansible.builtin.file:
        path: "{{ beszel_agent_path }}"
        state: directory
        mode: "0755"
      when: env == 'production' and beszel_hub_url is defined and beszel_agent_token is defined

    - name: Template beszel-agent compose
      ansible.builtin.template:
        src: beszel-agent-compose.yml.j2
        dest: "{{ beszel_agent_path }}/docker-compose.yml"
        mode: "0644"
      when: env == 'production' and beszel_hub_url is defined and beszel_agent_token is defined

    - name: Pull beszel-agent image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ beszel_agent_path }}"
      when: env == 'production' and beszel_hub_url is defined and beszel_agent_token is defined

    - name: Start beszel-agent and wait until running
      community.docker.docker_compose_v2:
        project_src: "{{ beszel_agent_path }}"
        state: present
        wait: true
        wait_timeout: 120
      when: env == 'production' and beszel_hub_url is defined and beszel_agent_token is defined

    # Post-deploy verification from the controller, through the URL real
    # visitors use (LAN IP / tunnel / Cloudflare). Compose's wait only proves
    # the container healthcheck passes inside the container; this also catches
    # a broken published port, Caddy config, or edge path — and the version
    # check catches a healthy container still running the previous image.
    # Expected version uses the shared computation (scripts/build_version.py),
    # the same call docker/build.py makes at image build — the dev check only
    # means something if both sides agree byte-for-byte, including the
    # content-sensitive dirty suffix (MRFC 2026-09-03-dirty-tree-image-version-string).
    - name: Record expected version from the deploying checkout (dev)
      ansible.builtin.command: python3 {{ playbook_dir }}/../../scripts/build_version.py
      args:
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      run_once: true
      register: controller_version
      changed_when: false
      when: env == 'dev'

    - name: Expected version is the pinned git tag (staging/production)
      ansible.builtin.set_fact:
        deploy_expected_version: "{{ expected_version }}"
      when: env != 'dev'

    - name: Expected version is the deploying checkout (dev)
      ansible.builtin.set_fact:
        deploy_expected_version: "{{ controller_version.stdout }}"
      when: env == 'dev'

    - name: Verify deployment health and version
      ansible.builtin.command:
        cmd: >
          python3 {{ playbook_dir }}/../../scripts/check_deploy.py
          --base-url {{ public_url }}
          --version {{ deploy_expected_version }}
      delegate_to: localhost
      run_once: true
      changed_when: false

    # ---- Grafana tenant sync (delegated to hs1, the observability host) ----
    #
    # The platform Grafana on hs1 is owned by the external devops ops repo,
    # which rebuilds it from scratch (compose, datasources, policies; data
    # volume wiped, API keys re-issued). Tenants re-onboard under a
    # file-provisioning contract: markpost's side is the four-file set under
    # files/grafana/provisioning/ (dashboard provider, dashboards, alert
    # rules, contact point + policy; datasource references restricted to the
    # contract uids, dashboard uids in the markpost-* namespace — see the
    # grafana-tenant-rebuild RFC). This block pushes EXACTLY markpost's
    # whitelisted files, reloads alerting provisioning, and asserts the
    # platform loaded everything — on every deploy of every environment,
    # because the tenant assets are env-independent and the block is
    # idempotent: unchanged files are no-op copies, the reload repeats the
    # same admin call, and the assertions are reads, so repeated deploys
    # leave no residue. Dashboards apply on the 10s provisioning rescan;
    # alerting applies via the admin reload endpoint called below. The
    # delegated tasks connect with hs1's own ansible_user from the inventory
    # and become root only for the copies into the platform-owned tree.
    #
    # Setup-order contract, mirroring the otel-tokens guard in
    # otelcol-tokens.yml: the push runs token-free; the reload + assertions
    # need a Grafana service account token (Admin role: the reload endpoint
    # requires the provisioning:reload permission) vaulted as
    # grafana_api_token in host_vars/hs1.yml — the encrypt_string command is
    # documented there. Until then every deploy stays green with the
    # assertions skipped.
    #
    # One task per whitelisted file — a directory-level copy would claim
    # provisioning/ and clobber other tenants' files. become: the platform's
    # provisioning tree is platform-owned (root) on hs1; mode 0644 keeps the
    # files world-readable for the container's grafana user.
    - name: Push dashboards provider
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/markpost.yml
        dest: "{{ grafana_provisioning_path }}/dashboards/markpost.yml"
        mode: "0644"
      become: true
      delegate_to: hs1

    - name: Push overview dashboard
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/markpost/markpost-overview.json
        dest: "{{ grafana_provisioning_path }}/dashboards/markpost/markpost-overview.json"
        mode: "0644"
      become: true
      delegate_to: hs1

    - name: Push HTTP dashboard
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/markpost/markpost-http.json
        dest: "{{ grafana_provisioning_path }}/dashboards/markpost/markpost-http.json"
        mode: "0644"
      become: true
      delegate_to: hs1

    - name: Push runtime dashboard
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/markpost/markpost-runtime.json
        dest: "{{ grafana_provisioning_path }}/dashboards/markpost/markpost-runtime.json"
        mode: "0644"
      become: true
      delegate_to: hs1

    - name: Push delivery dashboard
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/markpost/markpost-delivery.json
        dest: "{{ grafana_provisioning_path }}/dashboards/markpost/markpost-delivery.json"
        mode: "0644"
      become: true
      delegate_to: hs1

    - name: Push alert rules
      ansible.builtin.copy:
        src: files/grafana/provisioning/alerting/markpost-rules.yaml
        dest: "{{ grafana_provisioning_path }}/alerting/markpost-rules.yaml"
        mode: "0644"
      become: true
      delegate_to: hs1

    - name: Push contact point and notification policy
      ansible.builtin.copy:
        src: files/grafana/provisioning/alerting/markpost-contact-points.yaml
        dest: "{{ grafana_provisioning_path }}/alerting/markpost-contact-points.yaml"
        mode: "0644"
      become: true
      delegate_to: hs1

    # Deletions are explicit and reviewable: retire a file by flipping its
    # push task to absent (and dropping the file from the repo in the same
    # change), e.g. for a retired dashboard:
    # - name: Remove retired dashboard
    #   ansible.builtin.file:
    #     path: "{{ grafana_provisioning_path }}/dashboards/markpost/markpost-old.json"
    #     state: absent
    #   become: true
    #   delegate_to: hs1

    # Everything below needs the vaulted API token (setup order: push now,
    # assert once the token exists). Dashboards apply on the 10s rescan;
    # alerting applies via this admin reload call. The bridge task pulls
    # hs1's vaulted token into this play's variable scope (delegated tasks
    # resolve against the env host — see the vars block above), so the gated
    # tasks below read a plain name instead of repeating a hostvars[]
    # reference. no_log: set_fact prints its result by default, and the
    # result is the decrypted token. While hs1's vault has no token the
    # bridge skips and grafana_api_token stays undefined, which is exactly
    # what the gates below check.
    - name: Load the Grafana API token from hs1's vault
      ansible.builtin.set_fact:
        grafana_api_token: "{{ hostvars['hs1'].grafana_api_token }}"
      when: hostvars['hs1'].grafana_api_token is defined
      no_log: true
      tags:
        - assert

    - name: Reload alerting provisioning
      ansible.builtin.uri:
        url: "{{ grafana_api_base }}/api/admin/provisioning/alerting/reload"
        method: POST
        headers:
          Authorization: "Bearer {{ grafana_api_token }}"
        status_code: 200
      when: grafana_api_token is defined
      delegate_to: hs1
      tags:
        - assert

    - name: Wait for the markpost folder and its dashboards to be scanned
      ansible.builtin.uri:
        url: "{{ grafana_api_base }}/api/search?type=dash-folder&query=markpost"
        headers:
          Authorization: "Bearer {{ grafana_api_token }}"
        status_code: 200
      register: grafana_folder_search
      until:
        - grafana_folder_search.json is defined
        - grafana_folder_search.json | selectattr('title', 'equalto', 'markpost') | list | length > 0
      retries: 12
      delay: 5
      when: grafana_api_token is defined
      delegate_to: hs1
      tags:
        - assert

    - name: Resolve the markpost folder uid
      ansible.builtin.set_fact:
        grafana_folder_uid: "{{ grafana_folder_search.json | selectattr('title', 'equalto', 'markpost') | map(attribute='uid') | first | default('') }}"
      when: grafana_api_token is defined
      tags:
        - assert

    - name: List dashboards in the markpost folder
      ansible.builtin.uri:
        url: "{{ grafana_api_base }}/api/search?type=dash-db&folderUIDs={{ grafana_folder_uid }}"
        headers:
          Authorization: "Bearer {{ grafana_api_token }}"
        status_code: 200
      register: grafana_folder_dashboards
      when: grafana_api_token is defined
      delegate_to: hs1
      tags:
        - assert

    - name: Assert the folder holds exactly the four tenant dashboards
      ansible.builtin.assert:
        that:
          - grafana_folder_uid | length > 0
          - grafana_folder_dashboards.json | length == 4
          - grafana_folder_dashboards.json | map(attribute='uid') | list | sort == grafana_dashboard_uids | sort
        success_msg: "markpost folder holds exactly {{ grafana_dashboard_uids | length }} dashboards"
      when: grafana_api_token is defined
      tags:
        - assert

    - name: Assert every dashboard uid resolves
      ansible.builtin.uri:
        url: "{{ grafana_api_base }}/api/dashboards/uid/{{ item }}"
        headers:
          Authorization: "Bearer {{ grafana_api_token }}"
        status_code: 200
      loop: "{{ grafana_dashboard_uids }}"
      when: grafana_api_token is defined
      delegate_to: hs1
      tags:
        - assert

    # The ruler API keys its response by folder fullpath ("markpost"), each
    # entry a list of groups carrying a `rules` array.
    - name: Fetch the loaded rule groups
      ansible.builtin.uri:
        url: "{{ grafana_api_base }}/api/ruler/grafana/api/v1/rules"
        headers:
          Authorization: "Bearer {{ grafana_api_token }}"
        status_code: 200
      register: grafana_ruler_rules
      when: grafana_api_token is defined
      delegate_to: hs1
      tags:
        - assert

    - name: Assert the markpost rule groups loaded
      ansible.builtin.assert:
        that:
          - grafana_ruler_rules.json['markpost'] is defined
          - grafana_ruler_rules.json['markpost'] | map(attribute='rules') | list | flatten | length == grafana_rule_count
        success_msg: "markpost folder holds {{ grafana_rule_count }} provisioned rules"
      when: grafana_api_token is defined
      tags:
        - assert

    - name: Fetch the notification policy tree and contact points
      ansible.builtin.uri:
        url: "{{ grafana_api_base }}{{ item }}"
        headers:
          Authorization: "Bearer {{ grafana_api_token }}"
        status_code: 200
      loop:
        - /api/v1/provisioning/policies
        - /api/v1/provisioning/contact-points
      register: grafana_routing
      when: grafana_api_token is defined
      delegate_to: hs1
      tags:
        - assert

    - name: Assert every notification-policy receiver resolves to a contact point
      vars:
        policy_tree: "{{ grafana_routing.results[0].json }}"
        contact_point_names: "{{ grafana_routing.results[1].json | map(attribute='name') | list }}"
        # Root + up to two levels of nested routes: route<->contact-point
        # pairs stay shallow by contract.
        referenced_receivers: "{{ ([policy_tree.receiver] + (policy_tree.routes | default([]) | map(attribute='receiver') | list) + (policy_tree.routes | default([]) | map(attribute='routes') | map('default', []) | flatten | map(attribute='receiver') | list)) | unique }}"
      ansible.builtin.assert:
        that:
          - referenced_receivers | difference(contact_point_names) | length == 0
          - "'markpost-email' in contact_point_names"
        success_msg: "all notification-policy receivers resolve to existing contact points"
      when: grafana_api_token is defined
      tags:
        - assert

  handlers:
    - name: Reload host Caddy gateway
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
      become: true

    # reread spots the new/changed conf; update applies it — starting the
    # program on first deploy and restarting it when the script changes.
    # supervisorctl speaks to a root-owned socket, hence become.
    - name: Update markpost heartbeat supervisor program
      ansible.builtin.shell: supervisorctl reread && supervisorctl update
      become: true
