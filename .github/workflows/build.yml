name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - '.github/workflows/build.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify generated files up to date
        working-directory: backend
        # Regenerate Swagger docs and embedded CSS, then fail if anything
        # differs from what's committed — catches "forgot to regen".
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/server/main.go -o docs --parseDependency --parseInternal
          go generate ./internal/web
          git diff --exit-code -- docs internal/web
      - name: Build
        working-directory: backend
        # CGO disabled: markpost has no C dependencies (sqlite was removed),
        # so this yields a static binary and simplifies cross-compilation.
        # Version is injected from git describe (CI checkout has .git), falling
        # back to "dev" when there are no tags yet.
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${VERSION}" -o markpost ./cmd/server
      - name: Compile all packages
        working-directory: backend
        # The server binary build above only covers ./cmd/server; this catches
        # compile errors in auxiliary packages (cmd/buildcss, tools/).
        run: CGO_ENABLED=0 go build ./...

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: pnpm build
