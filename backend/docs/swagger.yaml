basePath: /
definitions:
  apierr.ErrorResponse:
    properties:
      code:
        type: string
      errors:
        items:
          $ref: '#/definitions/apierr.FieldError'
        type: array
      message:
        type: string
    type: object
  apierr.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  delivery.ChannelConfiguration:
    additionalProperties: {}
    type: object
  delivery.ChannelKind:
    enum:
    - feishu
    type: string
    x-enum-varnames:
    - ChannelKindFeishu
  delivery.DailyStat:
    properties:
      day:
        description: YYYY-MM-DD (UTC)
        type: string
      delivered:
        type: integer
      expired:
        type: integer
      failed:
        type: integer
    type: object
  delivery.LockedChannel:
    properties:
      channel_id:
        type: integer
      channel_name:
        type: string
      fails:
        type: integer
      failure_rate:
        type: number
      last_at:
        type: string
      last_error:
        type: string
      total:
        type: integer
      username:
        type: string
    type: object
  delivery.PendingAttemptRow:
    properties:
      channel_id:
        type: integer
      channel_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      post_id:
        type: integer
      post_qid:
        type: string
      post_title:
        type: string
    type: object
  delivery.TodayCounts:
    properties:
      delivered:
        type: integer
      failed:
        type: integer
      pending:
        type: integer
    type: object
  settings.SettingValue:
    properties:
      enabled:
        type: boolean
    type: object
  user.RefreshToken:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      revoked:
        type: boolean
      user_id:
        type: integer
    type: object
  v1.AdminChannelItem:
    properties:
      configuration:
        $ref: '#/definitions/delivery.ChannelConfiguration'
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      kind:
        type: string
      name:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  v1.AdminCreateChannelRequest:
    properties:
      configuration:
        items:
          type: integer
        type: array
      keywords:
        type: string
      kind:
        type: string
      name:
        type: string
      user_id:
        type: integer
    required:
    - configuration
    - kind
    - name
    - user_id
    type: object
  v1.AdminCreateUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  v1.AdminLockedChannelsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/delivery.LockedChannel'
        type: array
    type: object
  v1.AdminResetPasswordResponse:
    properties:
      password:
        type: string
    type: object
  v1.AdminSetChannelEnabledRequest:
    properties:
      enabled:
        type: boolean
    type: object
  v1.AdminSetSettingRequest:
    properties:
      enabled:
        type: boolean
    type: object
  v1.AdminSetUserActiveRequest:
    properties:
      active:
        type: boolean
    type: object
  v1.AdminSetUserRoleRequest:
    properties:
      role:
        enum:
        - admin
        - user
        type: string
    required:
    - role
    type: object
  v1.AdminSetUserVIPRequest:
    properties:
      vip:
        type: boolean
    type: object
  v1.AdminSettingItem:
    properties:
      key:
        type: string
      updated_at:
        type: string
      updated_by:
        type: integer
      value:
        $ref: '#/definitions/settings.SettingValue'
    type: object
  v1.AdminSettingListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.AdminSettingItem'
        type: array
    type: object
  v1.AdminStatsCounts:
    properties:
      channels:
        type: integer
      history:
        type: integer
      history_week_delta:
        type: integer
      posts:
        type: integer
      posts_week_delta:
        type: integer
      users:
        type: integer
      users_week_delta:
        type: integer
    type: object
  v1.AdminStatsResponse:
    properties:
      counts:
        $ref: '#/definitions/v1.AdminStatsCounts'
    type: object
  v1.AdminUserItem:
    properties:
      created_at:
        type: string
      email:
        type: string
      github_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      is_email_verified:
        type: boolean
      last_login_at:
        type: string
      name:
        type: string
      post_key:
        type: string
      role:
        type: string
      username:
        type: string
      vip:
        type: boolean
    type: object
  v1.AuthResponse:
    properties:
      expires_in:
        type: integer
      refresh_token:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/v1.UserResponse'
    type: object
  v1.ChangePasswordResponse:
    properties:
      expires_in:
        type: integer
      refresh_token:
        type: string
      token:
        type: string
    type: object
  v1.ChannelResponse:
    properties:
      configuration:
        $ref: '#/definitions/delivery.ChannelConfiguration'
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      keywords:
        type: string
      kind:
        $ref: '#/definitions/delivery.ChannelKind'
      name:
        type: string
      updated_at:
        type: string
    type: object
  v1.ChannelsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.ChannelResponse'
        type: array
    type: object
  v1.CreateDeliveryChannelRequest:
    properties:
      configuration:
        items:
          type: integer
        type: array
      keywords:
        type: string
      kind:
        type: string
      name:
        type: string
    required:
    - configuration
    - kind
    - name
    type: object
  v1.CreatePostResponse:
    properties:
      id:
        type: string
    type: object
  v1.DeliveryHistoryItem:
    properties:
      channel_id:
        type: integer
      channel_name:
        type: string
      created_at:
        type: string
      error_category:
        type: string
      id:
        type: integer
      last_error:
        type: string
      post_qid:
        type: string
      post_title:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  v1.DeliveryHistoryListResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/v1.DeliveryHistoryItem'
        type: array
      pagination:
        $ref: '#/definitions/v1.Pagination'
    type: object
  v1.DeliveryLatestListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.DeliveryHistoryItem'
        type: array
    type: object
  v1.DeliveryStatsResponse:
    properties:
      today:
        $ref: '#/definitions/delivery.TodayCounts'
      trend:
        items:
          $ref: '#/definitions/delivery.DailyStat'
        type: array
    type: object
  v1.GitHubLoginRequest:
    properties:
      code:
        type: string
      state:
        type: string
    required:
    - code
    - state
    type: object
  v1.HealthResponse:
    properties:
      status:
        type: string
    type: object
  v1.MessageResponse:
    properties:
      message:
        type: string
    type: object
  v1.OAuthURLResponse:
    properties:
      state:
        type: string
      url:
        type: string
    type: object
  v1.PaginatedItemsResponse:
    properties:
      items: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  v1.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  v1.PasswordChangeRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - new_password
    type: object
  v1.PendingAttemptsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/delivery.PendingAttemptRow'
        type: array
    type: object
  v1.PostKeyResponse:
    properties:
      created_at:
        type: string
      post_key:
        type: string
    type: object
  v1.PostListItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      qid:
        type: string
      title:
        type: string
    type: object
  v1.PostRequest:
    properties:
      body:
        type: string
      title:
        type: string
    required:
    - body
    - title
    type: object
  v1.PostsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.PostListItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  v1.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  v1.RefreshTokenResponse:
    properties:
      expires_in:
        type: integer
      refresh_token:
        type: string
      token:
        type: string
    type: object
  v1.RotatePostKeyResponse:
    properties:
      post_key:
        type: string
    type: object
  v1.SessionsResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/user.RefreshToken'
        type: array
    type: object
  v1.SingleChannelResponse:
    properties:
      channel:
        $ref: '#/definitions/v1.ChannelResponse'
    type: object
  v1.UpdateDeliveryChannelRequest:
    properties:
      configuration:
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      keywords:
        type: string
      kind:
        type: string
      name:
        type: string
    type: object
  v1.UserResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_email_verified:
        type: boolean
      name:
        type: string
      role:
        type: string
      username:
        type: string
      vip:
        type: boolean
    type: object
  v1.UsernameLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  v1.VersionResponse:
    properties:
      version:
        type: string
    type: object
host: localhost:7330
info:
  contact: {}
  description: Markpost backend API for post management and delivery.
  title: Markpost API
  version: "1.0"
paths:
  /{id}:
    get:
      parameters:
      - description: Post QID
        in: path
        name: id
        required: true
        type: string
      - description: Response format (raw returns markdown)
        in: query
        name: format
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      summary: Render a post as HTML or raw markdown
      tags:
      - posts
  /{post_key}:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post key used for authentication
        in: path
        name: post_key
        required: true
        type: string
      - description: Post title and markdown body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CreatePostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      summary: Create a new post with a post key
      tags:
      - posts
  /api/v1/admin/audit-logs:
    get:
      parameters:
      - description: Actor user ID filter
        in: query
        name: actor_id
        type: integer
      - description: Action filter
        in: query
        name: action
        type: string
      - description: Target type filter
        in: query
        name: target_type
        type: string
      - description: Target ID filter
        in: query
        name: target_id
        type: string
      - description: RFC3339 start time
        in: query
        name: since
        type: string
      - description: RFC3339 end time
        in: query
        name: until
        type: string
      - default: 1
        description: Page number (min 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (min 1)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PaginatedItemsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs (admin)
      tags:
      - admin
  /api/v1/admin/delivery/channels:
    get:
      parameters:
      - default: 1
        description: Page number (min 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (min 1)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PaginatedItemsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all delivery channels (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Channel details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.AdminCreateChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.AdminChannelItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a delivery channel (admin)
      tags:
      - admin
  /api/v1/admin/delivery/channels/{id}:
    delete:
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a delivery channel (admin)
      tags:
      - admin
  /api/v1/admin/delivery/channels/{id}/enabled:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Enabled status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.AdminSetChannelEnabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enable or disable a delivery channel (admin)
      tags:
      - admin
  /api/v1/admin/delivery/history:
    get:
      parameters:
      - description: User ID filter
        in: query
        name: user_id
        type: integer
      - description: Channel ID filter
        in: query
        name: channel_id
        type: integer
      - description: Status filter (delivered/failed/expired)
        in: query
        name: status
        type: string
      - description: Error category filter (card_rejected/upstream_client_error/upstream_server_error/upstream_business_error/network/internal)
        in: query
        name: error_category
        type: string
      - default: 1
        description: Page number (min 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (min 1)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DeliveryHistoryListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all delivery history (admin)
      tags:
      - admin
  /api/v1/admin/delivery/stats:
    get:
      parameters:
      - description: Days to aggregate (default 7)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DeliveryStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get site-wide delivery trend (admin, D2.5)
      tags:
      - admin
  /api/v1/admin/locked-channels:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AdminLockedChannelsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List channels with persistent delivery failures (admin, D2.1)
      tags:
      - admin
  /api/v1/admin/posts:
    get:
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Username filter (F.9)
        in: query
        name: username
        type: string
      - default: 1
        description: Page number (min 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (min 1)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PaginatedItemsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all posts (admin)
      tags:
      - admin
  /api/v1/admin/posts/{id}:
    delete:
      parameters:
      - description: Post QID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete any post (admin)
      tags:
      - admin
  /api/v1/admin/sessions/{token_id}:
    delete:
      parameters:
      - description: Session (refresh token) ID
        in: path
        name: token_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a single user session (admin, D3.2)
      tags:
      - admin
  /api/v1/admin/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AdminSettingListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List runtime settings (admin)
      tags:
      - admin
  /api/v1/admin/settings/{key}:
    put:
      consumes:
      - application/json
      parameters:
      - description: 'Setting key (v1: vip)'
        in: path
        name: key
        required: true
        type: string
      - description: Setting value
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.AdminSetSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AdminSettingListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upsert one runtime setting (admin)
      tags:
      - admin
  /api/v1/admin/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AdminStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin dashboard statistics (D2.4, includes week deltas)
