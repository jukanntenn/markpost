---
# markpost unified deployment playbook.
#
# A single playbook serves dev / staging / production. The target environment
# is selected with --limit (mandatory), and per-environment differences live in
# group_vars/<env>.yml. Run from devops/ansible/:
#
#   cd devops/ansible
#   ansible-playbook -i hosts.yml deploy.yml -l dev --vault-password-file ~/.ansible-vault/markpost-dev.pwd
#   ansible-playbook -i hosts.yml deploy.yml -l staging --vault-password-file ~/.ansible-vault/markpost-staging.pwd
#   ansible-playbook -i hosts.yml deploy.yml -l production --vault-password-file ~/.ansible-vault/markpost-production.pwd

- name: Deploy markpost
  hosts: all
  user: "{{ user }}"
  gather_facts: false

  tasks:
    - name: Load environment vault
      ansible.builtin.include_vars:
        file: "vars/{{ env }}/vault.yml"

    - name: Require --limit so a single environment is targeted
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: >-
          Refusing to run without --limit. Specify the environment explicitly,
          e.g. -l production, to avoid deploying to every host at once.

    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ app_dirs }}"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Template config.toml
      ansible.builtin.template:
        src: config.toml.j2
        dest: "{{ config_file }}"
        mode: "0600"

    - name: Template Caddyfile
      ansible.builtin.template:
        src: "{{ caddyfile_template }}"
        dest: "{{ caddyfile }}"
        mode: "0644"

    # Schema changes are applied by `markpost migrate up`, never implicitly on
    # serve — infra.New only opens the connection. So the deploy has to order
    # postgres → migrate → app itself, rather than bringing everything up at
    # once: a new image whose code expects a new column would otherwise start
    # serving against an un-migrated database.
    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ app_path }}"

    - name: Start postgres and wait until it is healthy
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        services:
          - postgres
        state: present
        wait: true
        wait_timeout: 120

    # Idempotent: MigrateUp swallows migrate.ErrNoChange, so re-running is a
    # no-op. It reports "changed" every time regardless because the command
    # gives no machine-readable way to tell a no-op from an applied migration.
    - name: Apply database migrations
      community.docker.docker_compose_v2_run:
        project_src: "{{ app_path }}"
        service: markpost
        entrypoint: markpost
        argv:
          - "-c"
          - "/app/config.toml"
          - "migrate"
          - "up"
        no_deps: true
        cleanup: true
        detach: false
        # tty=false emits -T/--no-TTY. interactive is deliberately left at its
        # default: interactive=false would emit --no-interactive, a flag docker
        # compose does not have (checked against v5.1.3), and the run fails with
        # "unknown flag: --no-interactive".
        tty: false

    - name: Start all services and wait until healthy
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        state: present
        remove_orphans: true
        wait: true
        wait_timeout: 120
