host: localhost:7330
info:
  contact: {}
  description: Markpost backend API for post management and delivery.
  title: Markpost API
  version: "1.0"
paths:
  /{id}:
    get:
      parameters:
      - description: Post QID
        in: path
        name: id
        required: true
        type: string
      - description: Response format (raw returns markdown)
        in: query
        name: format
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/markpost_internal_apierr.ErrorResponse'
      summary: Render a post as HTML or raw markdown
      tags:
      - posts
  /{post_key}:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post key used for authentication
        in: path
        name: post_key
        required: true
        type: string
      - description: Post title and markdown body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api_rest_v1.PostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api_rest_v1.CreatePostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/markpost_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/markpost_internal_apierr.ErrorResponse'
      summary: Create a new post with a post key
      tags:
      - posts
  /api/v1/admin/audit-logs:
    get:
      parameters:
      - default: 1
        description: Page number (min 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (min 1)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_rest_v1.PaginatedAuditLogs'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/markpost_internal_apierr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/markpost_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs (admin)
      tags:
      - admin
  /api/v1/admin/channels:
