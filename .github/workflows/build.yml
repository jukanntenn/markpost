name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - '.github/workflows/build.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        # CGO disabled: markpost has no C dependencies (sqlite was removed),
        # so this yields a static binary and simplifies cross-compilation.
        # Version is injected from git describe (CI checkout has .git), falling
        # back to "dev" when there are no tags yet.
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${VERSION}" -o markpost ./cmd/server
      - name: Compile all packages
        working-directory: backend
        # The server binary build above only covers ./cmd/server; this catches
        # compile errors in auxiliary packages (cmd/buildcss, tools/).
        run: CGO_ENABLED=0 go build ./...

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: pnpm build

  # Stable per-workflow verdict for branch protection's required checks
  # (.agents/mrfcs/implemented/2026-08-24-pr-conclusion-jobs-required-checks.md):
  # runs past skips and failures, skipped jobs count as success.
  conclusion:
    # Distinct check name so branch protection's required-check picker is
    # unambiguous (five bare "conclusion" names are not selectable apart).
    name: Build conclusion
    needs: [changes, build-backend, build-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::A job failed or was cancelled: $results"
            exit 1
          fi
