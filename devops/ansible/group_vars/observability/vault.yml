---
# markpost observability secrets — per-variable !vault blocks, auto-loaded
# with the group. Encrypt a new value with (plaintext via stdin):
#   ansible-vault encrypt_string --vault-id markpost-observability@~/.local/bin/avpm-client \
#     --stdin-name grafana_api_token >> group_vars/observability/vault.yml
#
# grafana_api_token: a Grafana service account token (Admin role) for the
# platform's HTTP API — grafana-tenant.yml uses it for the alerting
# provisioning reload and the post-push assertions; until it is vaulted the
# playbook pushes the files and skips the assertions (setup-order contract).
