# prek configuration — workspace root. See:
#   - backend/prek.toml   (Go hooks, cwd=backend)
#   - frontend/prek.toml  (JS/TS hooks, cwd=frontend)
#
# Single source of truth for the whole pipeline: AI post-edit hooks run
# `prek run --group fmt --files <edited>`, AI Stop runs `prek run --group lint
# --all-files`, CI runs `prek run --all-files`. No parallel formatter/lint
# definition exists outside prek.
#
# Install: prek install

default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# Mutating/fixer builtins share one generated-file exemption (the generator
# owns those bytes; a fixer diverging from raw output would trip the
# generate-check gate in backend/prek.toml). The regex is inlined per hook
# because prek does not support config-level variable interpolation.

# ---- Read-only builtin checks (commit + CI; cover the whole tree) ----
[[repos]]
repo = "builtin"
hooks = [
  # ansible-vault files use !vault tags — valid Ansible, unparsable as plain
  # YAML; newer prek check-yaml builds reject them, so they are excluded.
  { id = "check-yaml", exclude = "^devops/ansible/group_vars/[^/]+/vault\\.yml$" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

# ---- fmt group: mutating fixers (AI post-edit + commit) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|backend/internal/web/(csshash\\.go|post\\.[0-9a-f]+\\.css)$", groups = [
    "fmt",
  ] },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ], exclude = "backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|backend/internal/web/(csshash\\.go|post\\.[0-9a-f]+\\.css)$", groups = [
    "fmt",
  ] },
  { id = "end-of-file-fixer", exclude = "backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|backend/internal/web/(csshash\\.go|post\\.[0-9a-f]+\\.css)$", groups = [
    "fmt",
  ] },
]

# ---- GitHub Actions: actionlint (auto-installed via go install) ----
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "local"

# Agent-instruction mirrors in sync: byte-identical AGENTS.md/CLAUDE.md
# pairs (list in scripts/agentlib.py) plus the .claude/skills ->
# .agents/skills mirror. Self-healing: a single-sided edit is copied over
# the stale twin and staged; only a both-sides-changed conflict or a
# deletion fails, with guidance in the error output.
[[repos.hooks]]
id = "agent-instructions-sync"
name = "Agent instructions in sync"
language = "system"
entry = "scripts/check_agent_instructions.py"
files = "(^|/)(AGENTS|CLAUDE)\\.md$|^\\.claude/skills/|^\\.agents/skills/"
pass_filenames = false
stages = ["pre-commit"]

# Issue/pull-request policy logic carries its own unittest suite; the
# workflow files lint via actionlint above, the logic gates here (CI runs
# the same suite through `prek run --all-files`).
[[repos.hooks]]
id = "issue-policy-tests"
name = "issue policy unit tests"
language = "system"
entry = "python3 .github/issue-management/policy_test.py"
files = "^\\.github/issue-management/"
pass_filenames = false

# Same pattern for the prek patch-cache auditor's unit suite.
[[repos.hooks]]
id = "prek-patch-audit-tests"
name = "prek patch audit unit tests"
language = "system"
entry = "python3 scripts/prek_patch_audit_test.py"
files = "^scripts/prek_patch_audit"
pass_filenames = false

# Same pattern for the shared image version-string computation (called by
# docker/build.py and the deploy playbook's dev check).
[[repos.hooks]]
id = "build-version-tests"
name = "build version unit tests"
language = "system"
entry = "python3 scripts/build_version_test.py"
files = "^scripts/build_version"
pass_filenames = false

# ---- fmt group: root-level formatters (non-frontend, non-agent-dir) ----
# prettier resolves through frontend's pinned install (CI installs pnpm and
# frontend deps but no toolchain-level prettier; a bare `prettier` entry
# depended on an ambient binary that only dev machines happened to have).
[[repos.hooks]]
id = "prettier-root"
name = "prettier (root, non-frontend)"
language = "system"
entry = "frontend/node_modules/.bin/prettier --write"
files = "\\.(md|ya?ml|html|json|css)$"
exclude = "^(\\.agents|\\.claude|\\.codex|\\.opencode|\\.zcode)/|^frontend/|^backend/docs/(docs\\.go|swagger\\.json|swagger\\.yaml)$|^backend/internal/web/post\\.[0-9a-f]+\\.css$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# oxfmt for toml (skipped gracefully if not installed).
[[repos.hooks]]
id = "oxfmt"
name = "oxfmt (toml)"
language = "system"
entry = "command -v oxfmt >/dev/null || { echo 'oxfmt not installed, skipping'; exit 0; }; oxfmt --write \"$@\""
shell = "bash"
files = "\\.toml$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# caddy fmt for Caddyfile (skipped gracefully if not installed; .j2 templates
# are intentionally NOT formatted — djlint collapses Ansible {% %} block tags
# and breaks trim_blocks rendering. See devops/ansible note in README.)
[[repos.hooks]]
id = "caddy-fmt"
name = "caddy fmt (Caddyfile)"
language = "system"
entry = "command -v caddy >/dev/null || { echo 'caddy not installed, skipping'; exit 0; }; for f in \"$@\"; do caddy fmt --overwrite \"$f\"; done"
shell = "bash"
files = "(^|/)Caddyfile(\\.(dev|staging|local|production))?$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# docker compose config: validates all three compose files the way the
# engine parses them — YAML anchor/merge-key resolution (docker/docker-compose.yml
# uses x-image/x-app-env + <<:), ${VAR:-default} interpolation, and the compose
# schema. None of that is covered by the builtin check-yaml. Client-side only:
# no daemon interaction, and runners/dev machines running this repo already
# ship the compose plugin. Skips (with a notice) where docker is absent.
[[repos.hooks]]
id = "compose-config"
name = "docker compose config (devops + docker)"
language = "system"
entry = "docker compose version >/dev/null 2>&1 || { echo 'docker compose unavailable, skipping'; exit 0; }; docker compose -f devops/docker-compose.yml config --quiet && docker compose -f docker/docker-compose.yml config --quiet && docker compose -f docker/docker-compose.local.yml config --quiet"
shell = "bash"
files = "^(devops|docker)/docker-compose[^/]*\\.yml$"
pass_filenames = false
stages = ["pre-commit"]

# ansible-playbook --syntax-check: deploy.yml is the deploy entrypoint; a
# YAML/task-structure error should fail at commit time, not at deploy time.
# ANSIBLE_VAULT_IDENTITY_LIST is overridden with a synthetic identity backed by
# a temp file: ansible hard-errors at startup when a listed vault password file
# is missing or empty, and ansible.cfg points at ~/.local/bin/avpm-client,
# which only exists on machines with avpm installed. The syntax check never
# actually decrypts anything, so any non-empty password file satisfies it.
# Prefers a local ansible-playbook, falls back to uvx with the full ansible
# meta-package — bare ansible-core lacks the community.docker collection
# deploy.yml resolves at syntax-check time, and CI runners have uv but no
# ansible. Skips only when neither exists, the same graceful-skip contract as
# oxfmt/caddy-fmt above.
[[repos.hooks]]
id = "ansible-syntax"
name = "ansible-playbook --syntax-check (deploy.yml)"
language = "system"
entry = "tmp=$(mktemp) && printf 'syntax-check\\n' > \"$tmp\" && { if command -v ansible-playbook >/dev/null 2>&1; then ANSIBLE_VAULT_IDENTITY_LIST=\"markpost-syntax@$tmp\" ansible-playbook --syntax-check devops/ansible/deploy.yml; elif command -v uvx >/dev/null 2>&1; then ANSIBLE_VAULT_IDENTITY_LIST=\"markpost-syntax@$tmp\" uvx --from 'ansible>=11,<12' ansible-playbook --syntax-check devops/ansible/deploy.yml; else echo 'ansible-playbook and uvx not installed, skipping'; fi; }; rc=$?; rm -f \"$tmp\"; exit $rc"
shell = "bash"
files = "^devops/ansible/|^ansible\\.cfg$"
pass_filenames = false
stages = ["pre-commit"]

# Ansible Jinja2 templates: validate they render to parseable output (no
# formatting — see caddy-fmt note on why djlint is not used).
[[repos.hooks]]
id = "ansible-templates"
name = "ansible templates render+parse (j2)"
language = "system"
entry = "scripts/check-ansible-templates.py"
files = "^devops/ansible/templates/.*\\.j2$"
pass_filenames = false
stages = ["pre-commit"]

# Documentation gates: current-state prose, relative links + fragments,
# one physical line per paragraph, specs/index completeness, MRFC format,
# bilingual pairs, word budgets (scripts/doc_sync.py). Incremental only — staged Markdown
# is passed through so each gate restricts itself; prek stashes unstaged
# changes during hook runs, so any wider scan would see a stale tree.
# Full-corpus runs are CI's job (docs.yml). Only the .agents/skills
# mirror is skipped (byte copy of .claude/skills, owned by
# agent-instructions-sync); .agents/mrfcs/ is hand-written content and
# stays gated. Ledgers, loadtest reports, and generated Swagger are
# outside gate scope (see docs/AGENTS.md).
[[repos.hooks]]
id = "doc-check"
name = "documentation gates (doc_sync)"
language = "system"
entry = "python3 scripts/doc_sync.py"
files = "\\.md$"
exclude = "^\\.agents/skills/|^\\.zcode/|^scripts/loadtest/|^backend/docs/|^(CHANGELOG|KNOWN_ISSUES)\\.md$"
pass_filenames = true
stages = ["pre-commit"]

# ---- commit-msg: Conventional Commits ----
[[repos.hooks]]
id = "conventional-commits"
name = "commit message format"
language = "system"
entry = "scripts/check_commit_msg.py"
pass_filenames = true
stages = ["commit-msg"]
