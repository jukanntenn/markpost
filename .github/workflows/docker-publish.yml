name: Publish Docker image

# Tag semantics (git tag -> Docker Hub tag on jukanntenn/markpost):
#   v0.1.3     -> 0.1.3 + latest   (stable release)
#   v0.1.3-rc.1-> 0.1.3-rc.1       (prerelease: version tag only, no latest)
# Stability is decided by the exact-match regex ^v\d+\.\d+\.\d+$ — identical
# rule to release.yml. The rolling `main` tag is NOT pushed here; it lives on
# the internal registry only (docker/build.py from a local checkout).
#
# Multi-arch is built natively (no QEMU): amd64 on ubuntu-latest, arm64 on the
# GitHub arm runner. Each platform pushes a per-arch tag, the merge job
# combines them into the final manifest lists.

on:
  push:
    tags:
      - "v*"

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tags
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Docker tags strip the leading "v": v0.1.3 -> 0.1.3,
          # v0.1.3-rc.1 -> 0.1.3-rc.1 (semver, hyphenated prerelease).
          DOCKER_TAG=${TAG#v}
          # A release is stable iff the git tag is exactly vX.Y.Z. Anything
          # else (any suffix: -rc.N, -beta, ...) is a prerelease: version tag
          # only, `latest` never moves. Same rule as release.yml.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
          else
            STABLE=false
          fi
          {
            echo "TAG=$TAG"
            echo "DOCKER_TAG=$DOCKER_TAG"
            echo "STABLE=$STABLE"
          } >> "$GITHUB_ENV"
          echo "git tag: $TAG -> docker tag: $DOCKER_TAG (stable: $STABLE)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: jukanntenn/markpost

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            jukanntenn/markpost:${{ env.DOCKER_TAG }}-${{ matrix.arch }}
            ${{ env.STABLE == 'true' && format('jukanntenn/markpost:latest-{0}', matrix.arch) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          DOCKER_TAG=${TAG#v}
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
          else
            STABLE=false
          fi
          {
            echo "DOCKER_TAG=$DOCKER_TAG"
            echo "STABLE=$STABLE"
          } >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (version tag)
        run: |
          docker buildx imagetools create \
            -t "jukanntenn/markpost:${DOCKER_TAG}" \
            "jukanntenn/markpost:${DOCKER_TAG}-amd64" \
            "jukanntenn/markpost:${DOCKER_TAG}-arm64"

      - name: Create & push manifest (latest)
        if: ${{ env.STABLE == 'true' }}
        run: |
          docker buildx imagetools create \
            -t jukanntenn/markpost:latest \
            jukanntenn/markpost:latest-amd64 \
            jukanntenn/markpost:latest-arm64

  # markpost-mcp image: same tag semantics and native multi-arch strategy as
  # the main image, one image name (jukanntenn/markpost-mcp).
  mcp_single_arch:
    name: Build & push markpost-mcp (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tags
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          DOCKER_TAG=${TAG#v}
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
          else
            STABLE=false
          fi
          {
            echo "TAG=$TAG"
            echo "DOCKER_TAG=$DOCKER_TAG"
            echo "STABLE=$STABLE"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: jukanntenn/markpost-mcp

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: mcp/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            jukanntenn/markpost-mcp:${{ env.DOCKER_TAG }}-${{ matrix.arch }}
            ${{ env.STABLE == 'true' && format('jukanntenn/markpost-mcp:latest-{0}', matrix.arch) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  mcp_manifests:
    name: Create markpost-mcp multi-arch manifests
    needs: [mcp_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          DOCKER_TAG=${TAG#v}
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
          else
            STABLE=false
          fi
          {
            echo "DOCKER_TAG=$DOCKER_TAG"
            echo "STABLE=$STABLE"
          } >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (version tag)
        run: |
          docker buildx imagetools create \
            -t "jukanntenn/markpost-mcp:${DOCKER_TAG}" \
            "jukanntenn/markpost-mcp:${DOCKER_TAG}-amd64" \
            "jukanntenn/markpost-mcp:${DOCKER_TAG}-arm64"

      - name: Create & push manifest (latest)
        if: ${{ env.STABLE == 'true' }}
        run: |
          docker buildx imagetools create \
            -t jukanntenn/markpost-mcp:latest \
            jukanntenn/markpost-mcp:latest-amd64 \
            jukanntenn/markpost-mcp:latest-arm64
