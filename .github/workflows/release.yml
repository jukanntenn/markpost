name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          version=${GITHUB_REF#refs/tags/v}
          awk "/\\[${version}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md 中未找到版本 ${version} 的条目。请确保 CHANGELOG.md 包含 [${version}] 的 section。"
            exit 1
          fi
          echo "path=release_notes.md" >> "$GITHUB_OUTPUT"

      # Same rule as docker-publish.yml: stable iff the git tag is exactly
      # vX.Y.Z; any suffix (-rc.N, -beta, ...) makes it a prerelease.
      - name: Resolve release type
        id: semver
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: ${{ steps.semver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.semver.outputs.prerelease == 'false' }}
