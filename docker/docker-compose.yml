# Markpost — Docker Compose Quick Start
#
# 1. Copy .env.example to .env and edit the values
# 2. docker compose up -d
# 3. Open http://<your-ip>:2053
#
# For the full list of environment variables, see .env.example

# The app and the migrate one-shot must run the same image against the same
# database, and config validation applies to every subcommand (the JWT keys are
# required even by `migrate up`), so the whole environment is defined once here
# and shared by both services.
x-image: &image jukanntenn/markpost:latest
x-app-env: &app-env
  MARKPOST_DB__DRIVER: postgresql
  # Unix-socket connection over the shared postgres-socket volume. The password
  # must match POSTGRES_PASSWORD below.
  MARKPOST_DB__DSN: "host=/var/run/postgresql user=${POSTGRES_USER:-markpost} password=${POSTGRES_PASSWORD:-markpost} dbname=${POSTGRES_DB:-markpost} sslmode=disable"
  # Admin credentials (only effective on first boot)
  MARKPOST_ADMIN__INITIAL_USERNAME: ${MARKPOST_ADMIN__INITIAL_USERNAME:-markpost}
  MARKPOST_ADMIN__INITIAL_PASSWORD: ${MARKPOST_ADMIN__INITIAL_PASSWORD:-markpost}
  # JWT signing keys (change these!)
  MARKPOST_JWT__ACCESS_SIGNING_KEY: ${MARKPOST_JWT__ACCESS_SIGNING_KEY:-change-me}
  MARKPOST_JWT__REFRESH_SIGNING_KEY: ${MARKPOST_JWT__REFRESH_SIGNING_KEY:-change-me}
  # Public URL (optional, e.g. https://markpost.example.com)
  MARKPOST_SERVER__PUBLIC_URL: ${MARKPOST_SERVER__PUBLIC_URL:-}
  # Observability: write app/traces/metrics JSONL to the bind-mounted dir.
  MARKPOST_OBSERVABILITY__LOG_DIR: /app/data/logs

services:
  markpost:
    # Available tags: latest, v0.2.0-rc.1, v0.1.0 (https://hub.docker.com/r/jukanntenn/markpost/tags)
    image: *image
    container_name: markpost
    ports:
      - "2053:2053"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Bind-mount the observability JSONL dir (app/traces/metrics-*.jsonl) so
      # logs/traces/metrics are visible on the host under ./data/logs.
      - ./data/logs:/app/data/logs
      - postgres-socket:/var/run/postgresql
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:2053/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Applies the database schema, then exits. Migrations are never run implicitly
  # on serve — the app only opens the connection — so a fresh `docker compose
  # up` would otherwise start against an empty database. Overriding entrypoint
  # bypasses s6 and runs the CLI directly. Idempotent: a no-op once the schema
  # is current, so it is safe on every subsequent up.
  migrate:
    image: *image
    container_name: markpost-migrate
    entrypoint: ["markpost", "migrate", "up"]
    environment:
      <<: *app-env
    volumes:
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: markpost-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-markpost}
      - POSTGRES_USER=${POSTGRES_USER:-markpost}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-markpost}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h /var/run/postgresql -U ${POSTGRES_USER:-markpost}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  postgres-socket:
