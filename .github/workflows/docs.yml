name: Docs

# Documentation gates (hdsh: one line per paragraph, relative links +
# fragments, word budgets, RFC format + archive, bilingual pairing,
# adoption verify) plus the agent-instruction mirror check.
# Lint ignores *.md by path filter, so doc-only changes get their own fast
# job — hdsh installs via uv, no other toolchain needed.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".agents/rfcs/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - ".hdsh/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/check_agent_instructions.py"
      - "scripts/sync_agent_instructions.py"
      - "scripts/agentlib.py"
      - "prek.toml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # Same positive list the push trigger uses; path selectivity lives
          # at job level so required checks cannot hang at "Expected".
          filters: |
            docs:
              - '**/*.md'
              - '.agents/rfcs/**'
              - '.agents/skills/**'
              - '.claude/skills/**'
              - '.hdsh/**'
              - '.github/ISSUE_TEMPLATE/**'
              - 'scripts/check_agent_instructions.py'
              - 'scripts/sync_agent_instructions.py'
              - 'scripts/agentlib.py'
              - 'prek.toml'
              - '.github/workflows/docs.yml'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install hdsh (pinned ref)
        run: uv tool install "harness-deepseek-harness @ git+https://github.com/jukanntenn/harness-deepseek-harness@${HDSH_REF}"
        env:
          # Keep in sync with the adopt-managed prek block in prek.toml.
          HDSH_REF: 3b1668f4bfebe6c967595ac023dd411d9bc8b5b9

      - name: Documentation gates
        run: |
          hdsh docs wrap
          hdsh docs links
          hdsh docs budgets
          hdsh pairing verify
          hdsh rfc verify
          hdsh rfc archive
          hdsh adopt verify

      - name: Agent instructions in sync
        run: python3 scripts/check_agent_instructions.py

  # Stable per-workflow verdict for branch protection's required checks
  # (.agents/rfcs/implemented/process/2026-08-24-pr-conclusion-jobs-required-checks.md):
  # runs past skips and failures, skipped jobs count as success.
  conclusion:
    # Distinct check name so branch protection's required-check picker is
    # unambiguous (five bare "conclusion" names are not selectable apart).
    name: Docs conclusion
    needs: [changes, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::A job failed or was cancelled: $results"
            exit 1
          fi
