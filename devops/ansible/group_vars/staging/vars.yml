---
# staging (oect @ 192.168.5.50) — treated as production-grade self-hosted.
# Mirrors production topology (Postgres via Unix socket) but without Cloudflare
# and without HTTPS. It is the promotion gate for production, so it runs a
# pinned Docker Hub release rather than a floating tag: the artifact validated
# here must be byte-identical to the one production will run.

env: staging

# Bump this to deploy a new release; override for a one-off with
#   ansible-playbook devops/ansible/deploy.yml -e target=staging -e markpost_version=0.2.1
# Format: the Docker Hub tag. Releases after the tag-format switch drop the
# leading "v" (v0.2.1 -> 0.2.1, v0.2.1-rc.1 -> 0.2.1-rc.1); v0.2.0-rc.3 below
# predates the switch.
markpost_version: "0.2.0-rc.4"
image: "jukanntenn/markpost:{{ markpost_version }}"

# Version the binary reports at /api/v1/version (VERSION build-arg = the git
# tag at build time, v-prefixed). The deploy fails if it does not match.
# For releases built after the tag-format switch this is "v" + markpost_version.
expected_version: "v0.2.0-rc.4"

public_url: "https://markpost.bytehome.fun"
trusted_proxies: '["127.0.0.1", "::1"]'

host_port: 8089
tls_profile: http
caddyfile_template: Caddyfile.staging
debug: false

# Postgres data stays in the named pgdata volume; app data (observability JSONL)
# is bind-mounted from the host in every environment, so the dir must exist —
# otherwise Docker creates it as root and the container cannot write logs.
app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"

# DR backup repository on Backblaze B2 — staging's own bucket, so promotion-
# gate backups never mix with production's (MRFC
# 2026-07-09-wal-archival-disaster-recovery). Same setup-order contract as
# production: create the bucket + no-delete key first (docs/backup.md), vault
# the pair as b2_repo_key_id / b2_repo_app_key, then deploy.
b2_s3_endpoint: s3.us-west-004.backblazeb2.com
b2_s3_region: us-west-004
b2_bucket: markpost-backups-staging
