---
# markpost producer-token sync into the shared otelcol-contrib token file.
#
# The collector on the NAS (observability host) is the shared OTLP entry for
# every tenant; its bearertokenauth extension reads one token file
# (filename: /etc/otelcol-contrib/tokens, bind-mounted from
# ~/docker/otelcol/tokens on the NAS host) and hot-reloads it on change
# (fsnotify) — no collector restart. The file itself is platform-owned: the devops ops repo
# creates and validates it; this playbook only adds markpost's three lines
# (one per env), idempotently. Cross-repo content contract:
#   - only token lines and blank lines — NO comments of any kind: the parser
#     takes strings.Fields(line)[0] as the token, so a whole-line "#"
#     comment would register literal "#" as a valid token
#     (bearertokenauth.go, updateAuthorizationValues, upstream
#     otel-collector-contrib extension/bearertokenauthextension).
#   - line format "<token> # tenant=<t> env=<e> repo=<r>"; each tenant
#     anchors its own lines with a regexp on its own trailing comment, so
#     writers never touch each other's lines.
#   - every writer pins owner 10001, group 10001, mode 0600 on every write
#     (numeric uid/gid: the image runs as USER 10001 and the host has no
#     such username; bind-mount perms pass through).
#
# Run from the repo root — ansible.cfg supplies the inventory and all three
# vault identities, so every env's token decrypts (chown to uid 10001 needs
# root: pass --ask-become-pass if the NAS user is not passwordless-sudo):
#   ansible-playbook devops/ansible/otelcol-tokens.yml
#
# Rotation: python3 scripts/vault.py set <env> otel_otlp_token, then re-run —
# the collector picks the new value up on its own (hot reload).

- name: Sync markpost producer tokens into the shared otelcol token file
  hosts: observability
  user: "{{ user }}"
  gather_facts: false

  tasks:
    # All three env vaults define the same variable name (otel_otlp_token);
    # include_vars' `name` namespaces each mapping so the three coexist.
    - name: Load dev vault (namespaced)
      ansible.builtin.include_vars:
        file: group_vars/dev/vault.yml
        name: dev_vault

    - name: Load staging vault (namespaced)
      ansible.builtin.include_vars:
        file: group_vars/staging/vault.yml
        name: staging_vault

    - name: Load production vault (namespaced)
      ansible.builtin.include_vars:
        file: group_vars/production/vault.yml
        name: production_vault

    # Setup-order contract, mirroring the heartbeat/beszel guards in
    # deploy.yml: everything below is skipped — and the run stays green —
    # until every env's token is vaulted. Provision with
    # `python3 scripts/vault.py set <env> otel_otlp_token`.
    - name: Determine whether all three producer tokens are vaulted
      ansible.builtin.set_fact:
        otel_tokens_ready: "{{ dev_vault.otel_otlp_token is defined and staging_vault.otel_otlp_token is defined and production_vault.otel_otlp_token is defined }}"

    # One line per env, anchored on its own trailing comment so re-runs and
    # rotations replace exactly markpost's line and never another tenant's.
    # `trim` keeps a trailing newline inside a vaulted value from splitting
    # the comment onto its own line — which would register "#" as a token.
    # become: pinning owner 10001 is a chown to a foreign uid — root only.
    - name: Sync dev producer token line
      ansible.builtin.lineinfile:
        path: "{{ otelcol_tokens_file }}"
        line: "{{ dev_vault.otel_otlp_token | trim }} # tenant=markpost env=dev repo=markpost"
        regexp: "env=dev repo=markpost$"
        owner: "10001"
        group: "10001"
        mode: "0600"
        create: true
      become: true
      when: otel_tokens_ready | bool

    - name: Sync staging producer token line
      ansible.builtin.lineinfile:
        path: "{{ otelcol_tokens_file }}"
        line: "{{ staging_vault.otel_otlp_token | trim }} # tenant=markpost env=staging repo=markpost"
        regexp: "env=staging repo=markpost$"
        owner: "10001"
        group: "10001"
        mode: "0600"
        create: true
      become: true
      when: otel_tokens_ready | bool

    - name: Sync production producer token line
      ansible.builtin.lineinfile:
        path: "{{ otelcol_tokens_file }}"
        line: "{{ production_vault.otel_otlp_token | trim }} # tenant=markpost env=production repo=markpost"
        regexp: "env=production repo=markpost$"
        owner: "10001"
        group: "10001"
        mode: "0600"
        create: true
      become: true
      when: otel_tokens_ready | bool
