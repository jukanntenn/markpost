---
# Shared variables for every markpost environment. Per-environment overrides
# live in group_vars/<env>/ (vars.yml + vault.yml); per-host facts (user, home)
# in host_vars/. Note: a group_vars/<env>/ directory shadows a sibling
# group_vars/<env>.yml in ansible-core >= 2.20, so the two layouts must not be
# mixed.

app_name: markpost
apps_path: "{{ home }}/docker"
app_path: "{{ apps_path }}/{{ app_name }}"
compose_file: "{{ app_path }}/docker-compose.yml"
config_file: "{{ app_path }}/config.toml"
caddyfile: "{{ app_path }}/Caddyfile"

# Beszel metrics agent — its own compose project, a sibling of the app, so
# monitoring and app deploys stay independent (production only; see
# docs/monitoring.md and the Beszel topology MRFC).
beszel_agent_path: "{{ apps_path }}/beszel-agent"

# Internal ports are identical across every environment:
#   - Go backend listens on 7330 (server.port default, never published).
#   - Caddy listens on 2053 inside the container and is the only published port.
go_port: 7330
caddy_port: 2053

# Postgres is a sibling container in every environment, reached over the shared
# postgres-socket named volume (Unix socket) — never published on the host.
postgres_db: markpost
postgres_user: markpost

# Pinned into config.toml [db].timezone so the Postgres session timezone and the
# app clock agree. Override per environment if a deployment wants local time.
db_timezone: "UTC"
