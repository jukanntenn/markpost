# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint.json
# golangci-lint configuration
# Documentation: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - revive
    - bodyclose
    - rowserrcheck
    - nilnil
    - noctx
    - contextcheck
    - errorlint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    staticcheck:
      checks: ["all"]

    revive:
      confidence: 0.8

  exclusions:
    # "lax" reliably skips swag's docs.go header (which doesn't match the
    # strict "^// Code generated ... DO NOT EDIT.$" regex due to its
    # "Package docs" prefix and missing trailing period).
    generated: lax
    rules:
      - path: _test\.go
        linters: [noctx, contextcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: ["markpost"]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  formats:
    text:
      colors: true
      print-issued-lines: true
      print-linter-name: true
