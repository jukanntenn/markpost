# markpost ansible configuration — run playbooks from the repo root:
#   ansible-playbook devops/ansible/deploy.yml                 # dev (fn), default
#   ansible-playbook devops/ansible/deploy.yml -e target=staging
#   ansible-playbook devops/ansible/deploy.yml -e target=production
#
# Inventory and vault sources are declared here so no -i/--vault-password-file
# flags are needed. Secrets are per-variable !vault blocks in
# devops/ansible/group_vars/<env>/vault.yml; each environment's password lives
# in the avpm keyring under markpost-dev / markpost-staging / markpost-prod
# (vault identities below). Manage variables with scripts/vault.py, which
# wraps these identities ergonomically:
#   python3 scripts/vault.py set <env> <name>     # upsert one encrypted variable
#   python3 scripts/vault.py get <env> <name>     # print one decrypted value
#   python3 scripts/vault.py check                # decrypt-verify every environment

[defaults]
inventory = devops/ansible/hosts.yml
vault_identity_list = markpost-dev@~/.local/bin/avpm-client, markpost-staging@~/.local/bin/avpm-client, markpost-prod@~/.local/bin/avpm-client
callback_result_format = yaml
callback_result_indentation = 2
