# backend project — Go-specific hooks that must run with cwd=backend/ (where
# go.mod lives). Workspace mode strips the backend/ prefix so golangci-lint
# receives project-relative paths (foo.go, not backend/foo.go), enabling fast
# per-file formatting via `prek run --group fmt --files <path>`.
#
# Not declared orphan: root builtins (trailing-whitespace, check-yaml, ...)
# still cover backend files; golangci-lint skips generated *.go via its own
# `generated: lax` setting, so they are exempt without an exclude here.
#
# golangci-lint hooks point GOLANGCI_LINT_CACHE at a per-tree directory:
# prek's workspace scheduler runs the backend and mcp golangci hooks
# concurrently, and while the /tmp/golangci-lint.lock conflict is allowed
# away (run.allow-parallel-runners in .golangci.yml), the analysis caches
# still should not write over each other — separate trees, separate caches.

[[repos]]
repo = "local"

# ---- fmt group: mutating formatters (AI post-edit + commit) ----
[[repos.hooks]]
id = "golangci-fmt"
name = "golangci-lint fmt (backend)"
language = "system"
entry = "GOLANGCI_LINT_CACHE=\"$PWD/.golangci-cache\" golangci-lint fmt"
shell = "bash"
files = "\\.go$"
pass_filenames = true
groups = ["fmt"]
stages = ["pre-commit"]

# ---- lint group: read-only gate (AI Stop + commit + CI) ----
# --allow-serial-runners: prek runs same-depth workspace projects (backend,
# cli) concurrently, so two `golangci-lint run` instances race for golangci's
# own file lock; the flag makes the loser wait instead of failing.
[[repos.hooks]]
id = "golangci-run"
name = "golangci-lint run (backend)"
language = "system"
entry = "GOLANGCI_LINT_CACHE=\"$PWD/.golangci-cache\" golangci-lint run"
shell = "bash"
files = "\\.go$"
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "golangci-config-verify"
name = "golangci-lint config verify (backend)"
language = "system"
entry = "golangci-lint config verify"
files = "^\\.golangci\\.yml$"
pass_filenames = false
stages = ["pre-commit"]

# Generated-files drift gate. go generate ./... is the single source of
# regeneration (swag via the go.mod tool directive + buildcss via the
# //go:generate in internal/web/gen.go). Fails if committed output is stale.
[[repos.hooks]]
id = "backend-generate-check"
name = "generated files up to date (backend)"
language = "system"
entry = "go generate ./... && git diff --exit-code -- docs internal/web/csshash.go 'internal/web/post.*.css'"
shell = "bash"
files = "\\.go$|^templates/post\\.css$|^cmd/buildcss/"
pass_filenames = false
stages = ["pre-commit"]

# ---- pre-push: tests (mirrors CI test.yml exactly) ----
# `go build ./...` first because `go test` skips compile-only failures in
# packages without test files (cmd/buildcss, tools/), which CI's build job
# would then catch. -race matches `go test -race -covermode=atomic` in CI —
# omitting it locally lets data races through with a green push.
[[repos.hooks]]
id = "backend-build-and-test"
name = "go build + go test -race (backend, pre-push)"
language = "system"
entry = "go build ./... && go test -race ./..."
shell = "bash"
files = "\\.go$"
pass_filenames = false
stages = ["pre-push"]
