name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

# Single source of truth: every check CI runs is declared in prek
# (prek.toml + backend/prek.toml + frontend/prek.toml). CI just installs the
# toolchains prek's hooks call (golangci-lint, pnpm, swag via go tool) and runs
# `prek run --all-files`. No parallel lint/format definition exists in CI.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      # Install golangci-lint (prek's backend hooks call it directly).
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate prek config
        run: uvx prek validate-config prek.toml

      - name: prek run --all-files (fmt + lint + generate-check gate)
        # Formatters mutate; prek exits non-zero if any file needed formatting
        # or any lint/gate failed — the comprehensive single-source gate.
        run: uvx prek run --all-files
