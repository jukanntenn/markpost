name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.f.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            run:
              - 'backend/**'
              - 'frontend/**'
              - 'docker/**'
              - 'e2e/**'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Dagger
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          dagger version
      - name: Run E2E
        run: dagger call -m e2e all --source .

  # Stable per-workflow verdict for branch protection's required checks
  # (.agents/mrfcs/implemented/2026-08-24-pr-conclusion-jobs-required-checks.md):
  # runs past skips and failures, skipped jobs count as success.
  conclusion:
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::A job failed or was cancelled: $results"
            exit 1
          fi
